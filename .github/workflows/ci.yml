name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Graphviz
        if: runner.os == 'Linux'
        # Runner package mirrors are occasionally unavailable; retry instead of failing the job.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install --yes graphviz; then exit 0; fi
            echo "apt attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Install Graphviz
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress --yes --limit-output

      - name: Install dependencies
        run: npm ci

      - name: Build and run all available tests
        run: npm test -- --fail-on-skip
